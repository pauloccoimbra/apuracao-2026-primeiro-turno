const IL=CANDS.findIndex(c=>c[0]==='13'),IF=CANDS.findIndex(c=>c[0]==='22');
const vvOf=u=>UFD[u][3].reduce((a,b)=>a+b,0);
const lead=u=>UFD[u][3][IF]-UFD[u][3][IL];
const ORDERS={
 real:{n:'Ordem real de apuração (50% das seções)',f:us=>us.slice().sort((a,b)=>(T50.find(x=>x[0]===a)||[0,999])[1]-(T50.find(x=>x[0]===b)||[0,999])[1])},
 big:{n:'Maiores primeiro (votos válidos)',f:us=>us.slice().sort((a,b)=>vvOf(b)-vvOf(a))},
 small:{n:'Menores primeiro (votos válidos)',f:us=>us.slice().sort((a,b)=>vvOf(a)-vvOf(b))},
 flavio:{n:'Mais favoráveis a Flávio primeiro',f:us=>us.slice().sort((a,b)=>lead(b)/vvOf(b)-lead(a)/vvOf(a))},
 lula:{n:'Mais favoráveis a Lula primeiro',f:us=>us.slice().sort((a,b)=>lead(a)/vvOf(a)-lead(b)/vvOf(b))},
 alpha:{n:'Ordem alfabética',f:us=>us.slice().sort((a,b)=>UFN[a].localeCompare(UFN[b],'pt'))}
};
const S={p:1,play:false,spd:5,exterior:false,ord:'real',rev:false,uf:null};
let ORD=[],SEG=[],N=0,TOT=[];
function build(){
  const us=ALL27.concat(S.exterior?['zz']:[]);let o=ORDERS[S.ord].f(us);if(S.rev)o=o.reverse();ORD=o;
  N=0;TOT=CANDS.map(()=>0);SEG=[];let cum=0;
  for(const u of ORD){const vv=vvOf(u);SEG.push({u,a:cum,b:cum+vv,vv});cum+=vv;UFD[u][3].forEach((v,i)=>TOT[i]+=v)}
  N=cum;for(const s of SEG){s.pa=s.a/N*100;s.pb=s.b/N*100}
}
function at(p){ // contagem acumulada em p% dos votos válidos do país
  const x=p/100*N,V=CANDS.map(()=>0);let cur=null;
  for(const s of SEG){if(x>=s.b){UFD[s.u][3].forEach((v,i)=>V[i]+=v)}else if(x>s.a){const f=(x-s.a)/s.vv;UFD[s.u][3].forEach((v,i)=>V[i]+=v*f);cur={u:s.u,f};break}else break}
  return{V,x,cur,done:SEG.filter(s=>x>=s.b-1e-6).length}
}
const order=()=>CANDS.map((c,i)=>i).sort((a,b)=>TOT[b]-TOT[a]);
const CH={};
function chart(id,o){
  const W=o.w||760,H=o.h||280,pl=50,pr=14,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb,X=p=>pl+p/100*iw;
  const lo=o.ymin,hi=o.ymax,Y=v=>pt+(1-(v-lo)/(hi-lo))*ih;let g='';
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".7"/><text x="${pl-5}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="var(--muted)">${o.yf(v)}</text>`}
  for(let p=0;p<=100;p+=10)g+=`<text x="${X(p)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p}%</text>`;
  for(const s of SEG.slice(1))g+=`<line x1="${X(s.pa)}" x2="${X(s.pa)}" y1="${pt}" y2="${pt+ih}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 3"/>`;
  for(const h of o.hl||[])g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c||'var(--fg2)'}" stroke-dasharray="${h.d||'4 4'}" opacity=".8"/>`;
  for(const s of o.series){const d=s.ys.map((y,i)=>(i?'L':'M')+X(PTS[i]).toFixed(1)+' '+Y(y).toFixed(1)).join('');g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-linejoin="round"/>`}
  g+=`<line class="cur" x1="${X(S.p)}" x2="${X(S.p)}" y1="${pt}" y2="${pt+ih}" stroke="var(--fg)" opacity=".55"/><rect class="hit" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  CH[id]={W,pl,iw,X,tipf:o.tipf};
  return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg></div>`;
}
let PTS=[],SER=null;
function series(){
  // pontos: grade fina + fronteiras dos estados
  const set=new Set();for(let p=0;p<=100;p+=0.25)set.add(+p.toFixed(2));SEG.forEach(s=>{set.add(+s.pa.toFixed(4));set.add(+s.pb.toFixed(4))});
  PTS=[...set].sort((a,b)=>a-b);const sh=CANDS.map(()=>[]),ld=[];
  for(const p of PTS){const r=at(p||0.0001),sum=r.V.reduce((a,b)=>a+b,0);CANDS.forEach((c,i)=>sh[i].push(sum?r.V[i]/sum*100:null));ld.push(sum?(r.V[IF]-r.V[IL])/sum*100:0)}
  SER={sh,ld};
}
const pAt=(el,e)=>{const c=CH[el.dataset.ch],r=el.querySelector('svg').getBoundingClientRect();return Math.max(0,Math.min(100,((e.clientX-r.left)/r.width*c.W-c.pl)/c.iw*100))};
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]'),tip=$('#tip');if(!el||!e.target.classList.contains('hit')){tip.style.display='none';return}const c=CH[el.dataset.ch];tip.innerHTML=c.tipf(+pAt(el,e).toFixed(1));tip.style.display='block';tip.style.left=Math.min(innerWidth-270,e.clientX+14)+'px';tip.style.top=e.clientY+14+'px'});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.chart[data-ch]');if(el&&e.target.classList.contains('hit'))setP(+pAt(el,e).toFixed(1))});
function setP(p){S.p=Math.max(0,Math.min(100,p));$('#slider').value=S.p;$('#pin').value=(+S.p).toFixed(1).replace(/\.0$/,'');upd()}
function render(){
  build();series();
  const ord=order(),top=ord.slice(0,5).map(i=>CANDS[i][0]),sum=TOT.reduce((a,b)=>a+b,0),ci=k=>CANDS.findIndex(c=>c[0]===k);
  const rows=ord.map(i=>`<div class="row p4" data-i="${i}"><div class="nm"><span class="sw" style="background:${col(CANDS[i][0])}"></span><span class="t">${esc(CANDS[i][1])}</span><small>${CANDS[i][0]}</small></div><div class="trk"><i style="background:${col(CANDS[i][0])};width:0"></i></div><div class="v">0</div><div class="p">0%</div><div class="proj">${fp(TOT[i]/sum*100)}</div></div>`).join('');
  const ch1=chart('c1',{series:top.map(k=>({c:col(k),ys:SER.sh[ci(k)],w:2.2})),ymin:0,ymax:70,yf:v=>v.toFixed(0)+"%",tipf:p=>{const r=at(p),s=r.V.reduce((a,b)=>a+b,0);return `<b>${p}% dos votos do país</b>${r.cur?` · em ${r.cur.u.toUpperCase()}`:''}<br>`+top.map(k=>`${esc(CANDS[ci(k)][1])}: ${fp(s?r.V[ci(k)]/s*100:0)}`).join('<br>')},aria:'Percentual de cada candidato em função do percentual de votos do país apurado'});
  const fl=(TOT[IF]-TOT[IL])/sum*100;
  const ch2=chart('c2',{series:[{c:'var(--fg)',ys:SER.ld,w:2.2}],hl:[{y:0},{y:fl,c:'var(--good)'}],ymin:-12,ymax:30,yf:v=>(v>=0?'+':'−')+Math.abs(v).toFixed(0)+' p.p.',tipf:p=>{const r=at(p),s=r.V.reduce((a,b)=>a+b,0);return `<b>${p}%</b><br>Flávio − Lula: ${fs(s?(r.V[IF]-r.V[IL])/s*100:0)} p.p.`},aria:'Diferença entre Flávio Bolsonaro e Lula em pontos percentuais'});
  const strip=SEG.map(s=>`<button class="seg" data-u="${s.u}" data-a="${s.pa}" style="width:${s.vv/N*100}%;background:color-mix(in srgb,var(${lead(s.u)>=0?'--c2':'--c1'}) ${Math.round(18+Math.min(55,Math.abs(lead(s.u))/s.vv*100*1.1))}%,var(--surface2))" title="${UFN[s.u]}: ${fp(s.pa,1)} a ${fp(s.pb,1)}"><b>${s.vv/N>0.012?s.u.toUpperCase():''}</b><i data-f="${s.u}"></i></button>`).join('');
  $('#ord').innerHTML=Object.entries(ORDERS).map(([k,v])=>`<option value="${k}"${k===S.ord?' selected':''}>${v.n}</option>`).join('');
  $('#main').innerHTML=`<div class="callout" style="margin-bottom:14px"><b>Cenário fictício.</b> Os estados entram um de cada vez, na ordem escolhida, e cada estado é apurado de forma homogênea: os votos que entram têm sempre a mesma composição do resultado final do estado. O eixo mostra o % dos <b>votos válidos do país</b> já apurados, de modo que 1% corresponde a ${fi(N/100)} votos. A ordem muda o caminho do percentual de cada candidato, mas todas chegam ao mesmo resultado em 100%.</div>
  <div id="inst"><div class="grid kpis"><div class="card kpi"><div class="lab">Votos do país apurados</div><div class="big" data-k="p"></div><div class="det" data-k="pd"></div><div class="prog"><i data-k="bar"></i></div></div>
  <div class="card kpi"><div class="lab">Estados</div><div class="big" data-k="st"></div><div class="det" data-k="std"></div></div>
  <div class="card kpi"><div class="lab">Flávio Bolsonaro − Lula</div><div class="big num" data-k="m" style="font-size:22px"></div><div class="det" data-k="md"></div></div></div>
  <div class="card" style="margin-top:14px"><h2>Ordem em que os estados entram<span class="sub">largura = votos válidos · azul: Flávio à frente · vermelho: Lula à frente · <label><input type="checkbox" id="rev"${S.rev?' checked':''}> inverter</label> · <label><input type="checkbox" id="ext"${S.exterior?' checked':''}> incluir exterior</label></span></h2><div class="strip" id="strip">${strip}<span class="scur" id="scur"></span></div><div class="note" id="snote"></div></div>
  <div class="card" style="margin-top:14px"><h2>Evolução do percentual de cada candidato<span class="sub">x: % dos votos válidos do país apurados · clique para ir ao ponto</span></h2>${ch1}<div class="legend">${top.map(k=>`<span><i class="sw" style="background:${col(k)}"></i>${esc(CANDS[ci(k)][1])}</span>`).join('')}<span>linhas pontilhadas verticais: entrada de cada estado</span></div></div>
  <div class="grid two" style="margin-top:14px"><div class="card"><h2>Resultado nacional no ponto</h2><div class="res"><div class="row p4 head"><div>Candidato</div><div></div><div style="text-align:right">Votos</div><div style="text-align:right">Parcial</div><div class="proj" style="text-align:right">Final</div></div>${rows}</div></div>
  <div class="card"><h2>Diferença Flávio − Lula<span class="sub">pontos percentuais</span></h2>${ch2}<div class="legend"><span style="color:var(--good)">linha verde: resultado final</span></div></div></div></div>
  <div class="card" style="margin-top:14px"><h2>Estados na ordem de entrada</h2><div class="tw"><table><thead><tr><th class="n">#</th><th>UF</th><th class="n">Votos válidos</th><th class="n">Entra em</th><th class="n">Termina em</th><th class="n">Apurado no estado</th><th class="n">Lula %</th><th class="n">Flávio %</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  upd();
}
function upd(){
  const r=at(S.p),sum=TOT.reduce((a,b)=>a+b,0),vs=r.V.reduce((a,b)=>a+b,0);
  $('#clock').textContent=(+S.p).toFixed(1).replace('.',',').replace(',0','')+'%';
  const g=k=>document.querySelector(`[data-k=${k}]`);if(!g('p'))return;
  g('p').textContent=fp(S.p,1).replace(',0%','%');g('pd').textContent=`${fi(r.x)} de ${fi(N)} votos válidos`;g('bar').style.width=S.p+'%';
  g('st').textContent=`${r.done} de ${SEG.length}`;g('std').textContent=r.cur?`em apuração: ${UFN[r.cur.u]} (${fp(r.cur.f*100,0)} do estado)`:(r.done===SEG.length?'todos concluídos':'nenhum estado iniciado');
  g('m').textContent=fsi(r.V[IF]-r.V[IL]);g('md').textContent=vs?`${fs((r.V[IF]-r.V[IL])/vs*100)} p.p. dos votos apurados`:'sem votos apurados';
  document.querySelectorAll('.row[data-i]').forEach(e=>{const i=+e.dataset.i;e.querySelector('.v').textContent=fi(r.V[i]);const sh=vs?r.V[i]/vs*100:0;e.querySelector('.p').textContent=vs?fp(sh):'–';e.querySelector('i').style.width=Math.min(100,sh)+'%'});
  document.querySelectorAll('[data-f]').forEach(e=>{const s=SEG.find(x=>x.u===e.dataset.f);const f=Math.max(0,Math.min(1,(r.x-s.a)/s.vv));e.style.width=f*100+'%'});
  const sc=$('#scur');if(sc)sc.style.left=S.p+'%';
  $('#snote').textContent=r.cur?`Agora entrando: ${UFN[r.cur.u]}, com ${fp(r.cur.f*100,0)} dos seus votos já somados.`:'';
  $('#tb').innerHTML=SEG.map((s,i)=>{const f=Math.max(0,Math.min(1,(r.x-s.a)/s.vv)),v=UFD[s.u][3];return `<tr class="click${r.cur&&r.cur.u===s.u?' sel':''}" data-go="${s.pa}"><td class="n">${i+1}</td><td><b>${s.u.toUpperCase()}</b> ${UFN[s.u]}</td><td class="n num">${fi(s.vv)}</td><td class="n num">${fp(s.pa,1)}</td><td class="n num">${fp(s.pb,1)}</td><td class="n num">${fp(f*100,0)}</td><td class="n num">${fp(v[IL]/s.vv*100)}</td><td class="n num">${fp(v[IF]/s.vv*100)}</td></tr>`}).join('');
  document.querySelectorAll('.cur').forEach(l=>{const c=CH[l.closest('.chart').dataset.ch];l.setAttribute('x1',c.X(S.p));l.setAttribute('x2',c.X(S.p))});
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){setP(+t.dataset.go+0.001);return}const sg=e.target.closest('.seg');if(sg){const s=SEG.find(x=>x.u===sg.dataset.u);setP(+(s.pa+(s.pb-s.pa)/2).toFixed(2))}});
document.addEventListener('change',e=>{if(e.target.id==='ext'){S.exterior=e.target.checked;render()}if(e.target.id==='rev'){S.rev=e.target.checked;render()}if(e.target.id==='ord'){S.ord=e.target.value;S.rev=false;render()}});
$('#slider').addEventListener('input',e=>{setP(+e.target.value);S.pf=S.p});
$('#pin').addEventListener('change',e=>{setP(+e.target.value||0);S.pf=S.p});
$('#spd').addEventListener('change',e=>S.spd=+e.target.value);
let last=0;
function tick(ts){if(!S.play)return;const dt=Math.min(.25,(ts-last)/1000);last=ts;S.pf+=dt*S.spd;if(S.pf>=100){setP(100);stop();return}setP(+S.pf.toFixed(1));requestAnimationFrame(tick)}
function stop(){S.play=false;$('#play').textContent='Reproduzir'}
$('#play').addEventListener('click',()=>{if(S.play){stop();return}if(S.p>=100)setP(0);S.pf=S.p;S.play=true;$('#play').textContent='Pausar';last=performance.now();requestAnimationFrame(tick)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')setP(S.p+0.5);if(e.key==='ArrowLeft')setP(S.p-0.5)});
S.pf=1;render();setP(1);
</script><script>/* Barra de navegação comum a todas as páginas do site. */
(function(){const P=[['index.html','Painel'],['evolucao.html','Evolução'],['atemporal.html','Atemporal'],['mapa.html','Mapa'],['sintese.html','Síntese'],['perfil.html','Perfil do voto'],['participacao.html','Participação'],['segundo-turno.html','2º turno'],['governadores.html','Governadores'],['congresso.html','Congresso'],['maiorias.html','Maiorias'],['bancadas.html','Bancadas'],['assembleias.html','Assembleias']];
 const cur=(location.pathname.split('/').pop()||'index.html');
 const css=`#sitenav{background:var(--surface,#fff);border-bottom:1px solid var(--line,#d9dde4);font:500 13px/1.2 var(--sans,system-ui,sans-serif);position:relative;z-index:30}
#sitenav .in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;align-items:center}
#sitenav a{padding:9px 11px;color:var(--fg2,#4a5262);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
#sitenav a:hover{color:var(--fg,#161a22)}#sitenav a[aria-current=page]{color:var(--fg,#161a22);border-bottom-color:var(--accent,#0b5cad)}
#sitenav .sep{width:1px;height:16px;background:var(--line,#d9dde4);margin:0 6px;flex:none}`;
 const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
 const n=document.createElement('nav');n.id='sitenav';n.setAttribute('aria-label','Páginas do site');
 n.innerHTML='<div class="in">'+P.map((p,i)=>((i===4||i===9)?'<span class="sep"></span>':'')+`<a href="${p[0]}"${p[0]===cur?' aria-current="page"':''}>${p[1]}</a>`).join('')+'</div>';
 const go=()=>document.body.insertBefore(n,document.body.firstChild);document.body?go():document.addEventListener('DOMContentLoaded',go)})();

/* ===== Contador de visitas (GoatCounter) =====
   Preencha GC_CODE com o código do seu site no GoatCounter (a parte antes de .goatcounter.com).
   Enquanto estiver vazio, nada é carregado nem exibido. A contagem fica no servidor do GoatCounter,
   por isso não depende do navegador nem é zerada quando o site é republicado. */
(function(){
  const GC_CODE='';
  if(!GC_CODE)return;
  const base='https://'+GC_CODE+'.goatcounter.com/';
  const s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter',base+'count');document.head.appendChild(s);
  const box=document.createElement('div');
  box.style.cssText='text-align:center;font-size:12px;color:var(--muted,#888);padding:14px 16px 22px';
  box.setAttribute('aria-live','polite');
  (document.querySelector('footer')||document.body).appendChild(box);
  const fmt=n=>Number(n).toLocaleString('pt-BR');
  fetch(base+'counter/TOTAL.json').then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    const v=parseInt(String(j.count).replace(/\D/g,''),10);
    if(isFinite(v))box.textContent='Visualizações do site: '+fmt(v);
  }).catch(()=>{});
})();
</script></body></html>
