*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button,select,input{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;margin-right:4px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--fg2);font-size:12.5px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.err{background:var(--bad)} .dot.wait{background:var(--warn)}
.ctrl{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl select,.ctrl button,.btn{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.ctrl button:hover,.btn:hover{border-color:var(--accent)}
a.ext{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--fg2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:18px 60px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.card h2 .sub{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:6px}
.kpi .big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.kpi .det{font-size:12.5px;color:var(--fg2);margin-top:3px}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--accent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;flex:none}
.res{display:grid;gap:9px}
.row{display:grid;grid-template-columns:minmax(170px,1.6fr) minmax(70px,2fr) 82px 62px;gap:10px;align-items:center}
.row.p4{grid-template-columns:minmax(170px,1.6fr) minmax(70px,2fr) 82px 62px 62px}
@media (max-width:620px){.row,.row.p4{grid-template-columns:minmax(110px,1.4fr) minmax(40px,.6fr) 70px 56px}.row.p4 .proj{display:none}}
.row .nm{display:flex;align-items:center;min-width:0}
.row .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--muted);margin-left:6px;font-size:11.5px;white-space:nowrap}
.trk{height:14px;background:var(--surface2);border-radius:3px;position:relative}
.trk>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px 4px 4px 3px}
.trk>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.row .v,.row .p,.row .proj{text-align:right;font-variant-numeric:tabular-nums}
.row .p{font-weight:600}.row .proj{color:var(--muted)}
.row.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);margin-left:6px;white-space:nowrap}
.badge.w{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.callout{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));padding:9px 12px;border-radius:0 6px 6px 0;font-size:13px;color:var(--fg2)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--fg)}
th.n,td.n{text-align:right}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.sel td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.mini{display:inline-block;width:56px;height:5px;background:var(--surface2);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.tile{aspect-ratio:1.15;border:1px solid var(--line);border-radius:5px;background:var(--surface2);padding:3px 5px;text-align:left;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;font-size:11px}
.tile b{font-size:12px;font-weight:600}

.tile.empty{visibility:hidden}

.empty-msg{padding:28px 10px;text-align:center;color:var(--muted)}

.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}

h3{font-size:13px;margin:16px 0 6px;color:var(--fg2)}

ul.src{margin:6px 0;padding-left:18px} ul.src li{margin:3px 0}

.scrub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;border-top:1px solid var(--line)}

.scrub select{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

.k{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap}

.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mini-c{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
.mini-c .t{font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:2px}
.mini-c svg{display:block;width:100%;height:auto}
.prose p{margin:0 0 10px;max-width:78ch} .prose h3{margin:18px 0 6px}
.tile.g i{background:var(--accent)}
.tiles.big{max-width:460px}
.tile .pc{font-size:10px}

  <p>Para cada UF, a velocidade de apuração é a fração <code>f_UF(t)</code> de seções totalizadas ao longo do tempo. O total nacional parcial é <code>Σ f_UF(t)·V_UF,k / Σ f_UF(t)·V_UF</code>, com <code>V</code> os votos válidos finais, isto é, cada UF contribui com seus votos finais proporcionalmente ao que já apurou.</p>
  <p>As <b>trocas</b> atribuem a um estado a curva de velocidade de outro, e o <b>ranking</b> ordena os estados pelo horário em que alcançam 50% das seções. Como no notebook, o exterior fica de fora por padrão.</p>
  <h3>Origem das curvas</h3>
  <p>O TSE não publica o histórico minuto a minuto, mas cada seção carrega o horário de sua totalização nos arquivos de configuração de seções. Capturei esses horários às ${SNAP_AT} (horário de Brasília). Para estados já encerrados, o TSE regravou todos os horários de uma vez, perdendo a curva. Esses estados (<b>${rows}</b>) usam uma <b>curva estimada</b>: a curva média dos estados com horários reais, ajustada à hora de término informada pelo TSE. Os 16 demais têm <b>horários reais</b>.</p>
  <div class="callout">Os votos usados são os valores finais por UF no momento da captura, e o resultado parcial supõe votos homogêneos dentro da UF. A reconstrução mostra a dinâmica da apuração, não uma série oficial publicada.</div>
  <h3>Interrupção e demais cargos</h3>
  <p>Nos horários de totalização das seções capturados, nenhuma seção foi totalizada entre ${fHM(GAP.a)} e ${fHM(GAP.b+1)} nas UFs com horários reais. Para saber se governador, senador e deputados sofreram a mesma interrupção, comparei os arquivos municipais das duas eleições do TSE (6257, presidente; 6259, demais cargos). Em 5.571 municípios, 94% têm horário de totalização das duas eleições com diferença de até 1 minuto (93% das seções), e 98,8% até 5 minutos. As duas eleições são totalizadas juntas: a interrupção atingiu todos os cargos.</p>
  <p>Limite: o horário final por município e por UF dos arquivos agregados também registra reprocessamentos, então ele não serve como série de apuração. A série minuto a minuto vem apenas dos horários por seção, que só consegui capturar nas UFs listadas como "horários reais". O TSE não publica o resultado parcial por cargo ao longo do tempo, e por isso as abas de outros cargos usam a suposição homogênea do notebook.</p>
  <h3>Fontes</h3><ul class="src"><li><a class="ext" href="https://resultados.tse.jus.br/oficial/app/index.html" target="_blank" rel="noopener">Resultados TSE (oficial)</a></li><li>Arquivos públicos em <code>resultados.tse.jus.br/oficial/ele2026</code> e <code>arquivo-urna/3220/config</code></li></ul></div>
  <div class="card" style="margin-top:14px"><h2>Opções</h2><label><input type="checkbox" id="ext"${S.exterior?' checked':''}> Incluir o exterior no total nacional</label></div>`;
}

$('#spd').addEventListener('change',e=>S.spd=+e.target.value);

function tick(ts){if(!S.play)return;const dt=Math.min(.25,(ts-last)/1000);last=ts;S.mf+=dt*S.spd;if(S.mf>=HZ){setM(HZ);stop();return}const r=Math.round(S.mf);if(r!==S.m)setM(r);requestAnimationFrame(tick)}

document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')setM(S.m+1);if(e.key==='ArrowLeft')setM(S.m-1)});
/* ================= Outros cargos: governador, senador, deputados ================= */
const CARGOS={gov:{c:3,n:'Governador'},sen:{c:5,n:'Senador'},df:{c:6,n:'Deputado federal'},de:{c:7,n:'Deputado estadual'}};
S.cargo='gov';S.cuf='sp';
const CD={},CL={};
const cargoCode=(k,uf)=>k==='de'&&uf==='df'?8:CARGOS[k].c;
const urlC=(uf,c,e)=>`${BASE}${e}/dados/${uf}/${uf}-c${String(c).padStart(4,'0')}-e${String(e).padStart(6,'0')}-u.json`;
async function getj(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return r.json()}
async function pool(jobs,n){const out=[];let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<jobs.length){const k=i++;try{out[k]=await jobs[k]()}catch(e){out[k]={error:String(e.message||e)}}}}));return out}
function parseC(j,key){
  const car=(j.carg||[])[0];if(!car)return null;
  const maj=key==='gov'||key==='sen';const cands=[],agrs=[];
  for(const a of car.agr||[]){
    const ag={com:a.com||a.nm,votes:0,el:maj?0:num(a.vag),top:[]};
    for(const p of a.par||[]){ag.votes+=num(p.tvtn)+num(p.tvtl);for(const c of p.cand||[]){
      const o={n:String(c.n),nmu:c.nmu||c.nm,party:p.sg,vap:num(c.vap),e:c.e==='s'};
      if(maj)cands.push(o);else ag.top.push(o);
    }}
    ag.top.sort((x,y)=>y.vap-x.vap);ag.top=ag.top.slice(0,3);
    agrs.push(ag);
  }
  cands.sort((x,y)=>y.vap-x.vap);agrs.sort((x,y)=>y.votes-x.votes);
  const vsum=maj?cands.reduce((s,c)=>s+c.vap,0):agrs.reduce((s,a)=>s+a.votes,0);
  const vv=num(j.v&&j.v.vv)||vsum;
  return{cands,agrs,vv:maj?(num(j.v&&j.v.vv)||vsum):vsum,vvFile:vv,nv:num(car.nv)||1,ts:num(j.s&&j.s.ts),st:num(j.s&&j.s.st)};
}
async function loadCargo(key){
  if(CL[key]&&CL[key].busy)return;
  CL[key]={busy:true,done:0,err:0,total:27};CD[key]=CD[key]||{};
  const jobs=ALL27.map(u=>async()=>{
    const j=await getj(urlC(u,cargoCode(key,u),6259));const p=parseC(j,key);if(p)CD[key][u]=p;
    CL[key].done++;if(S.tab==='car'&&S.cargo===key)renderCar();
  });
  const res=await pool(jobs,5);
  CL[key].err=res.filter(r=>r&&r.error).length;CL[key].lastErr=(res.find(r=>r&&r.error)||{}).error;CL[key].busy=false;CL[key].fin=true;
  if(S.tab==='car'&&S.cargo===key)renderCar();
}
function viewCar(){
  const co=Object.entries(CARGOS).map(([k,v])=>`<option value="${k}"${k===S.cargo?' selected':''}>${v.n}</option>`).join('');
  const uo=ALL27.map(u=>`<option value="${u}"${u===S.cuf?' selected':''}>${UFN[u]} (${u.toUpperCase()})</option>`).join('');
  return `<div class="sim-ctrl"><label>Cargo <select id="cargo">${co}</select></label><label>Estado <select id="cuf">${uo}</select></label><button class="btn" id="creload">Recarregar do TSE</button></div><div id="carbody"></div>`;
}
function carAfter(){if(!CD[S.cargo]&&!(CL[S.cargo]&&CL[S.cargo].busy))loadCargo(S.cargo);renderCar()}
const labC=(k,o)=>k==='de'&&S.cuf==='df'?'Deputado distrital':CARGOS[k].n;
function renderCar(){
  const box=$('#carbody');if(!box)return;
  const k=S.cargo,u=S.cuf,st=CL[k]||{},data=(CD[k]||{})[u],maj=k==='gov'||k==='sen';
  if(!data){box.innerHTML=st.fin&&st.err?`<div class="callout">Não consegui ler os arquivos do TSE para este cargo (${esc(st.lastErr||'erro de rede')}). Abra a página com acesso à internet e use "Recarregar do TSE".</div>`:`<div class="card"><div class="empty-msg">Carregando resultados do TSE… ${st.done||0}/27 estados</div></div>`;return}
  const d=D[u],g=d.g[S.m];
  const items=maj?data.cands.slice(0,8).map(c=>({key:c.n,name:`${c.nmu} (${c.party})`,v:c.vap,sub:c.n,e:c.e})):data.agrs.slice(0,12).map(a=>({key:a.com,name:a.com,v:a.votes,sub:a.top.map(t=>t.nmu).slice(0,2).join(', '),e:a.el}));
  const den=maj?data.vv:data.vv;
  const colors=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
  const rows=items.map((it,i)=>`<tr><td><span class="sw" style="background:var(${colors[i%8]})"></span>${esc(it.name)}${it.sub&&!maj?` <small style="color:var(--muted)">${esc(it.sub)}</small>`:''}</td><td class="n num" data-cv="${i}">${fi(g*it.v)}</td><td class="n num">${fi(it.v)}</td><td class="n num">${fp(it.v/den*100)}</td><td class="n num">${maj?(it.e?'eleito':''):(it.e?it.e:'–')}</td></tr>`).join('');
  const sers=items.slice(0,6).map((it,i)=>{const xs=[],ys=[];for(let m=0;m<=HZ;m+=STEP){xs.push(T0+m*60000);ys.push(d.g[m]*it.v)}return{c:`var(${colors[i%8]})`,xs,ys,name:it.name}});
  const ch=lineChart('car1',{series:sers,ymin:0,yf:v=>v>=1e6?(v/1e6).toFixed(1)+' mi':v>=1e3?(v/1e3).toFixed(0)+' mil':v.toFixed(0),tipf:m=>`<b>${fHM(m)}</b> · ${fp(d.g[m]*100,1)} das seções<br>`+sers.slice(0,4).map((s,i)=>`${esc(items[i].name)}: ${fi(d.g[m]*items[i].v)}`).join('<br>'),aria:'Votos apurados ao longo do tempo'});
  const natBlock=maj?carNatMaj(k):carNatDep(k);
  box.innerHTML=`<div class="grid kpis"><div class="card kpi"><div class="lab">${labC(k)} · ${UFN[u]} · ${kindBadge(d)}</div><div class="big" data-ck="g">${fp(g*100,1)}</div><div class="det" data-ck="gd">${fi(g*d.st)} de ${fi(d.st)} seções às ${fHM(S.m)}</div><div class="prog"><i data-ck="bar" style="width:${g*100}%"></i></div></div>
   <div class="card kpi"><div class="lab">Votos válidos finais</div><div class="big num">${fi(den)}</div><div class="det">${maj?(k==='sen'?'cada eleitor vota em duas vagas; % sobre votos válidos':'% sobre votos válidos'):'% sobre votos válidos de legenda e nominais'}</div></div>
   <div class="card kpi"><div class="lab">Vagas</div><div class="big">${data.nv}</div><div class="det">${esc(CARGOS[k].n)} · ${UFN[u]}</div></div></div>
   <div class="grid two" style="margin-top:14px"><div class="card"><h2>${maj?'Candidatos':'Partidos e federações'}<span class="sub">votos apurados no instante</span></h2><div class="tw"><table><thead><tr><th>${maj?'Candidato':'Agrupamento'}</th><th class="n">Apurados</th><th class="n">Final</th><th class="n">%</th><th class="n">${maj?'':'Eleitos'}</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="note">Os arquivos públicos do TSE não guardam a série parcial por cargo. Aqui os votos finais de cada candidato são distribuídos pela curva de seções totalizadas do estado (suposição do notebook: votos homogêneos dentro do estado), e a mesma linha do tempo vale para todos os cargos, inclusive a interrupção.</div></div>
   <div class="card"><h2>Votos apurados ao longo do tempo<span class="sub">clique para ir ao instante</span></h2>${ch}</div></div>${natBlock}`;
}
function carNatMaj(k){
  const rows=ALL27.map(u=>{const p=(CD[k]||{})[u];if(!p||!p.cands.length)return null;const a=p.cands[0],b=p.cands[1]||{vap:0,nmu:'–',party:''};return{u,a,b,den:p.vv,g:D[u].g[S.m]}}).filter(Boolean);
  if(!rows.length)return '';
  rows.sort((x,y)=>(y.a.vap-y.b.vap)/y.den-(x.a.vap-x.b.vap)/x.den);
  const body=rows.map(r=>`<tr class="click" data-cu="${r.u}"><td><b>${r.u.toUpperCase()}</b> ${UFN[r.u]}</td><td>${esc(r.a.nmu)} (${esc(r.a.party)})</td><td class="n num">${fp(r.a.vap/r.den*100)}</td><td>${esc(r.b.nmu)} (${esc(r.b.party)})</td><td class="n num">${fp(r.b.vap/r.den*100)}</td><td class="n num">${fs((r.a.vap-r.b.vap)/r.den*100)} p.p.</td><td class="n num" data-cg="${r.u}">${fp(r.g*100,1)}</td></tr>`).join('');
  return `<div class="card" style="margin-top:14px"><h2>${CARGOS[k].n} em todos os estados<span class="sub">resultado final, ordenado pela margem</span></h2><div class="tw"><table><thead><tr><th>UF</th><th>1º</th><th class="n">%</th><th>2º</th><th class="n">%</th><th class="n">Margem</th><th class="n">Seções no instante</th></tr></thead><tbody>${body}</tbody></table></div>${rows.length<27?`<div class="note">${27-rows.length} estados ainda sem leitura.</div>`:''}</div>`;
}
function carNatDep(k){
  const ok=ALL27.filter(u=>(CD[k]||{})[u]);if(ok.length<27)return `<div class="card" style="margin-top:14px"><div class="empty-msg">Visão nacional por partido: ${ok.length}/27 estados lidos…</div></div>`;
  const P={};for(const u of ok)for(const a of CD[k][u].agrs){const q=P[a.com]||(P[a.com]={com:a.com,v:0,el:0});q.v+=a.votes;q.el+=a.el}
  const ord=Object.values(P).sort((a,b)=>b.v-a.v),tot=ord.reduce((s,x)=>s+x.v,0),top=ord.slice(0,8);
  const xs=[],ys=top.map(()=>[]);
  for(let m=0;m<=HZ;m+=STEP){xs.push(T0+m*60000);let den=0;const num=top.map(()=>0);
    for(const u of ok){const g=D[u].g[m];for(const a of CD[k][u].agrs){den+=g*a.votes;const i=top.findIndex(t=>t.com===a.com);if(i>=0)num[i]+=g*a.votes}}
    top.forEach((t,i)=>ys[i].push(den?num[i]/den*100:null))}
  const colors=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
  const sers=top.map((t,i)=>({c:`var(${colors[i]})`,xs,ys:ys[i]}));
  const hl=top.slice(0,3).map((t,i)=>({y:t.v/tot*100,c:`var(${colors[i]})`,l:'final'}));
  const ch=lineChart('carn',{series:sers,hl,ymin:0,yf:v=>v.toFixed(0)+'%',tipf:m=>`<b>${fHM(m)}</b><br>`+top.slice(0,4).map((t,i)=>`${esc(t.com)}: ${fp(ys[i][Math.round(m/STEP)]||0)}`).join('<br>'),aria:'Percentual nacional de votos por partido'});
  const body=ord.slice(0,20).map((x,i)=>`<tr><td>${i<8?`<span class="sw" style="background:var(${colors[i]})"></span>`:''}${esc(x.com)}</td><td class="n num">${fi(x.v)}</td><td class="n num">${fp(x.v/tot*100)}</td><td class="n num">${x.el}</td></tr>`).join('');
  return `<div class="grid two" style="margin-top:14px"><div class="card"><h2>${CARGOS[k].n}: total nacional por partido<span class="sub">soma dos 27 estados, sem exterior</span></h2><div class="tw"><table><thead><tr><th>Agrupamento</th><th class="n">Votos</th><th class="n">%</th><th class="n">Eleitos</th></tr></thead><tbody>${body}</tbody></table></div></div>
  <div class="card"><h2>Evolução do percentual nacional<span class="sub">: cada estado soma seus votos na velocidade da sua apuração</span></h2>${ch}</div></div>`;
}

  const r=e.target.closest('tr[data-cu]');if(r){S.cuf=r.dataset.cu;const s=$('#cuf');if(s)s.value=S.cuf;renderCar();scrollTo(0,0)}
});

const _ri=renderInst;
renderInst=function(){_ri();if(S.tab!=='car')return;const b=$('#carbody');if(!b)return;const u=S.cuf,k=S.cargo,data=(CD[k]||{})[u];if(!data)return;const g=D[u].g[S.m];
  const maj=k==='gov'||k==='sen';const items=maj?data.cands.slice(0,8).map(c=>c.vap):data.agrs.slice(0,12).map(a=>a.votes);
  const e1=b.querySelector('[data-ck=g]');if(e1)e1.textContent=fp(g*100,1);const e2=b.querySelector('[data-ck=gd]');if(e2)e2.textContent=`${fi(g*D[u].st)} de ${fi(D[u].st)} seções às ${fHM(S.m)}`;
  const e3=b.querySelector('[data-ck=bar]');if(e3)e3.style.width=g*100+'%';
  b.querySelectorAll('[data-cv]').forEach(c=>c.textContent=fi(g*items[+c.dataset.cv]));
  b.querySelectorAll('[data-cg]').forEach(c=>c.textContent=fp(D[c.dataset.cg].g[S.m]*100,1));
};
/* ================= Atualização dos votos finais de presidente e partida ================= */
async function refreshPres(){
  const jobs=ALL.map(u=>async()=>{const j=await getj(urlC(u,1,6257));const car=(j.carg||[])[0];if(!car)return;const V={};for(const a of car.agr||[])for(const p of a.par||[])for(const c of p.cand||[])V[String(c.n)]=num(c.vap);return[u,V,num(j.s&&j.s.ts),num(j.s&&j.s.st)]});
  const res=await pool(jobs,6);let ok=0;
  for(const r of res){if(!r||r.error||!r.length)continue;const [u,V,ts,st]=r;const sum=Object.values(V).reduce((a,b)=>a+b,0);if(!sum)continue;CAND.forEach(n=>D[u].V[n]=V[n]||0);if(ts>0){D[u].ts=ts;D[u].st=st||ts}ok++}
  if(ok>=27){S.presLive=fTimeM(Date.now());for(const k in cache)delete cache[k];render()}
}
S.m=HZ;render();setM(HZ);
refreshPres().catch(()=>{});
